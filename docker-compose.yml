# Local full-stack orchestration. `docker compose up --build` starts MongoDB, the
# backend, and the nginx-served frontend on an internal network. The MongoDB URI
# and environment are overridable to target a managed cluster instead.

name: mongodb-microservice

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # A single-node replica set: the transactional outbox needs multi-document
    # transactions, which a standalone server does not support.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    # Initiates the replica set on first start (a no-op once configured) and
    # reports healthy only when this node is the writable primary, so dependents
    # never start against a node that rejects writes.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate() }; quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  backend:
    build:
      context: ./src/backend
    # Tagged so the outbox relay runs the same image.
    image: mongodb-microservice-backend:local
    restart: unless-stopped
    # Exceeds the application's bounded request drain (20s) so Compose does not
    # kill the process before its shutdown hooks complete; the default is 10s.
    stop_grace_period: 30s
    environment:
      APP_ENV: ${APP_ENV:-development}
      # directConnection pins the driver to this host; the replica set member is
      # registered under the container's internal hostname, which other
      # containers cannot resolve.
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/?directConnection=true}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-microservice}
      MONGODB_PING_ON_STARTUP: "true"
      # Tracing is off by default; set OTEL_ENABLED=true (for example in a local
      # .env) to export spans to the Jaeger collector started by the
      # observability profile. The endpoint is the full OTLP/HTTP traces path.
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - internal

  # Message broker for domain events. Flags are passed explicitly instead of
  # using the image's default configuration file, which also opens a cluster
  # route port with a fixed credential; this single node needs only the client
  # port, the monitoring endpoint, and JetStream persistence.
  nats:
    image: nats:2.15-alpine@sha256:823e7f1d6d8ffe3b30dbd73d4a06bbb939acf94929f7fdf224404da7a05bafb5
    restart: unless-stopped
    command: ["--jetstream", "--store_dir=/data", "--port=4222", "--http_port=8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - internal

  # Publishes committed outbox events to JetStream. It runs the backend image
  # with a different entrypoint, so the relay ships no separate artifact. The
  # build section is repeated so the image never has to be pulled; the second
  # build is served entirely from the layer cache.
  outbox-relay:
    build:
      context: ./src/backend
    image: mongodb-microservice-backend:local
    restart: unless-stopped
    entrypoint: ["python3", "-m", "app.messaging.relay"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/?directConnection=true}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-microservice}
      NATS_URL: nats://nats:4222
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
    depends_on:
      mongo:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - internal

  # Consumes item events from JetStream and serves each item's history. It owns
  # a separate database on the same local server; with Atlas, it would receive
  # its own credential scoped to that database.
  audit:
    build:
      context: ./src/audit
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      APP_ENV: ${APP_ENV:-development}
      MONGODB_URI: ${AUDIT_MONGODB_URI:-mongodb://mongo:27017/?directConnection=true}
      MONGODB_DB_NAME: audit
      NATS_URL: nats://nats:4222
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
    depends_on:
      mongo:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - internal

  frontend:
    build:
      context: ./src/frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    # nginx resolves its upstream hosts at startup, so both API services must
    # exist before it starts.
    depends_on:
      - backend
      - audit
    networks:
      - internal

  # ----------------------------------------------------------------------------
  # Observability plane.
  # Gated behind the "observability" profile so the default stack stays lean;
  # start it with `docker compose --profile observability up`. Prometheus scrapes
  # the backend /metrics endpoint over the internal network and Grafana renders
  # the provisioned dashboard.
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.1
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - internal

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    restart: unless-stopped
    # Anonymous access with the login form disabled avoids provisioning a
    # credential for a strictly local, read-mostly dashboard. This posture is
    # local-only and is not carried into any deployed environment.
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - internal

  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    profiles: ["observability"]
    restart: unless-stopped
    # Enable the OTLP receivers so the backend can export spans over OTLP; the
    # trace store is in-memory, which suits local inspection.
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    networks:
      - internal

volumes:
  mongo-data:
  nats-data:
  prometheus-data:
  grafana-data:

networks:
  internal:
