# Local full-stack orchestration. `docker compose up --build` starts MongoDB, the
# backend, and the nginx-served frontend on an internal network. The MongoDB URI
# and environment are overridable to target a managed cluster instead.

name: mongodb-microservice

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  backend:
    build:
      context: ./src/backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-microservice}
      MONGODB_PING_ON_STARTUP: "true"
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - internal

  frontend:
    build:
      context: ./src/frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - internal

  # ----------------------------------------------------------------------------
  # Observability plane.
  # Gated behind the "observability" profile so the default stack stays lean;
  # start it with `docker compose --profile observability up`. Prometheus scrapes
  # the backend /metrics endpoint over the internal network and Grafana renders
  # the provisioned dashboard.
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.1
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - internal

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    restart: unless-stopped
    # Anonymous access with the login form disabled avoids provisioning a
    # credential for a strictly local, read-mostly dashboard. This posture is
    # local-only and is not carried into any deployed environment.
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - internal

volumes:
  mongo-data:
  prometheus-data:
  grafana-data:

networks:
  internal:
