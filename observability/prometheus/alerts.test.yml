# Unit tests for the recording and alerting rules, run with `promtool test
# rules` in CI.
#
# The availability cases use low traffic on purpose: a denominator clamped to
# one request per second once understated the error ratio whenever traffic fell
# below that rate, so a fifth of requests failing at 0.17 requests per second
# read as 3% and never alerted. Probe traffic is added alongside, because the
# objectives count API routes only and probes must not dilute them. The
# k8s/monitoring copy of the rules is held identical to this one by CI, so
# these tests cover both deployments.
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - name: a low-traffic outage burns the availability budget fast
    interval: 1m
    input_series:
      # 8 successes and 2 failures per minute: 0.17 req/s, 20% errors.
      - series: 'http_requests_total{job="backend",method="GET",path="/api/v1/items",status="200"}'
        values: "0+8x30"
      - series: 'http_requests_total{job="backend",method="GET",path="/api/v1/items",status="500"}'
        values: "0+2x30"
      - series: 'http_requests_total{job="backend",method="GET",path="/health/ready",status="200"}'
        values: "0+600x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: ApiAvailabilityBudgetBurnFast
        exp_alerts:
          - exp_labels:
              severity: critical
              slo: api-availability
            exp_annotations:
              summary: The items API is burning its availability budget fast
              description: >-
                Server errors consume the 30-day error budget of the 99.5%
                availability objective at six times the sustainable rate or
                more; at this pace the budget is exhausted within five days.

  # The long windows still hold the errors after they stop; the short windows
  # end the page. The six-hour condition keeps it until its thirty-minute
  # window no longer contains errors.
  - name: the page clears once the burn stops
    interval: 1m
    input_series:
      - series: 'http_requests_total{job="backend",method="GET",path="/api/v1/items",status="200"}'
        values: "0+8x60"
      - series: 'http_requests_total{job="backend",method="GET",path="/api/v1/items",status="500"}'
        values: "0+2x20 40x40"
    alert_rule_test:
      - eval_time: 25m
        alertname: ApiAvailabilityBudgetBurnFast
        exp_alerts:
          - exp_labels:
              severity: critical
              slo: api-availability
            exp_annotations:
              summary: The items API is burning its availability budget fast
              description: >-
                Server errors consume the 30-day error budget of the 99.5%
                availability objective at six times the sustainable rate or
                more; at this pace the budget is exhausted within five days.
      - eval_time: 55m
        alertname: ApiAvailabilityBudgetBurnFast
        exp_alerts: []

  # 2% errors for a day spends the budget four times too fast: a ticket, since
  # it stays below the six-times rate that pages.
  - name: a modest sustained error rate opens a ticket without paging
    interval: 1m
    input_series:
      - series: 'http_requests_total{job="backend",method="POST",path="/api/v1/items",status="201"}'
        values: "0+98x1620"
      - series: 'http_requests_total{job="backend",method="POST",path="/api/v1/items",status="500"}'
        values: "0+2x1620"
    alert_rule_test:
      - eval_time: 26h
        alertname: ApiAvailabilityBudgetBurnFast
        exp_alerts: []
      - eval_time: 26h
        alertname: ApiAvailabilityBudgetBurnSlow
        exp_alerts:
          - exp_labels:
              severity: warning
              slo: api-availability
            exp_annotations:
              summary: The items API is spending its availability budget too fast
              description: >-
                Server errors have consumed the error budget of the 99.5%
                availability objective at or above the sustainable rate for one
                to three days; the budget will not last the 30-day period.

  - name: low traffic without errors does not alert
    interval: 1m
    input_series:
      - series: 'http_requests_total{job="backend",method="GET",path="/api/v1/items",status="200"}'
        values: "0+8x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: ApiAvailabilityBudgetBurnFast
        exp_alerts: []
    promql_expr_test:
      - expr: slo:api_errors:ratio_rate5m
        eval_time: 15m
        exp_samples:
          - labels: "slo:api_errors:ratio_rate5m"
            value: 0

  - name: an idle service does not alert
    interval: 1m
    input_series:
      - series: 'http_requests_total{job="backend",method="GET",path="/api/v1/items",status="500"}'
        values: "5x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: ApiAvailabilityBudgetBurnFast
        exp_alerts: []

  # A fifth of requests above 500ms against a 1% budget burns it twenty times
  # too fast.
  - name: slow responses burn the latency budget fast
    interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_bucket{job="backend",method="GET",path="/api/v1/items",le="0.5"}'
        values: "0+80x30"
      - series: 'http_request_duration_seconds_count{job="backend",method="GET",path="/api/v1/items"}'
        values: "0+100x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: ApiLatencyBudgetBurnFast
        exp_alerts:
          - exp_labels:
              severity: critical
              slo: api-latency
            exp_annotations:
              summary: The items API is burning its latency budget fast
              description: >-
                Requests slower than 500ms consume the 30-day error budget of
                the 99% latency objective at six times the sustainable rate or
                more; at this pace the budget is exhausted within five days.

  - name: an unscrapeable backend alerts after one minute
    interval: 1m
    input_series:
      - series: 'up{job="backend",instance="backend:8000"}'
        values: "1 1 0 0 0 0"
    alert_rule_test:
      - eval_time: 5m
        alertname: BackendDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backend
              instance: backend:8000
            exp_annotations:
              summary: Backend target is not scrapeable
              description: >-
                Prometheus has failed to scrape the backend for over one minute,
                indicating the service is down or unreachable.

  - name: a stale outbox backlog alerts
    interval: 1m
    input_series:
      - series: 'outbox_oldest_pending_age_seconds{job="outbox-relay",instance="outbox-relay:9000"}'
        values: "0 30 90 150 210 270 330"
    alert_rule_test:
      - eval_time: 5m
        alertname: OutboxBacklogStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Outbox events are not being published
              description: >-
                The oldest unpublished outbox event is 4m 30s old; the relay
                cannot reach the broker or is not running.

  # A broker outage: the relay fails about four times a minute for eight
  # minutes, then recovers. The alert must fire during the outage and clear
  # shortly after it, not linger on failures that have stopped.
  - name: publish failures alert during an outage and clear after recovery
    interval: 1m
    input_series:
      - series: 'outbox_publish_failures_total{job="outbox-relay",instance="outbox-relay:9000"}'
        values: "0+4x8 32x10"
    alert_rule_test:
      - eval_time: 4m
        alertname: OutboxPublishFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Outbox publishes are failing
              description: The relay has been failing to publish to JetStream for two minutes.
      - eval_time: 11m
        alertname: OutboxPublishFailing
        exp_alerts: []

  # The consumer gauge drops to zero while the broker is unreachable.
  - name: a consumer unbound for two minutes alerts
    interval: 1m
    input_series:
      - series: 'audit_consumer_connected{job="audit",instance="audit:8000"}'
        values: "1 1 0 0 0 0 1"
    alert_rule_test:
      - eval_time: 5m
        alertname: AuditConsumerDisconnected
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: An audit replica is not bound to the stream
              description: >-
                At least one audit service replica has been reconnecting to JetStream
                for two minutes; history for new events is delayed.
      - eval_time: 6m
        alertname: AuditConsumerDisconnected
        exp_alerts: []

  # A dead letter alerts at once and holds until it is replayed or discarded.
  - name: an unresolved dead letter alerts until it is resolved
    interval: 1m
    input_series:
      - series: 'audit_dead_letters{job="audit",instance="audit:8000"}'
        values: "0 0 1 1 1 0"
    alert_rule_test:
      - eval_time: 1m
        alertname: AuditDeadLetters
        exp_alerts: []
      - eval_time: 2m
        alertname: AuditDeadLetters
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Events are missing from the audit history
              description: >-
                Abandoned events waiting in AUDIT_DEAD_LETTERS: 1. Resolve
                them with python3 -m app.replay in an audit service container.
      - eval_time: 5m
        alertname: AuditDeadLetters
        exp_alerts: []
