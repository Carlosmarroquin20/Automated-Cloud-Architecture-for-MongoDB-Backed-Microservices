# Prometheus scrape and alerting configuration.
#
# The backend already exposes application metrics on /metrics using route
# templates as labels, so scraping requires no exporter sidecar. Intervals are
# kept modest to bound local resource usage while remaining responsive.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: mongodb-microservice

# Alerting rules are evaluated in-process. An Alertmanager is intentionally not
# provisioned locally; firing rules are observable in the Prometheus UI without
# the additional service, keeping the local footprint minimal.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Application metrics. The target resolves over the Compose internal network to
  # the backend service; the same job name is reused by the Kubernetes overlay.
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: backend

  # Event pipeline. The relay is a worker without an HTTP API, so it serves its
  # metrics on a dedicated port; the audit service exposes them on its API port.
  # Job names match the workload names, as on Kubernetes, so dashboards and
  # alerts address both deployments identically.
  - job_name: outbox-relay
    static_configs:
      - targets: ["outbox-relay:9000"]
        labels:
          service: outbox-relay

  - job_name: audit
    metrics_path: /metrics
    static_configs:
      - targets: ["audit:8000"]
        labels:
          service: audit

  # Synthetic probes through the reverse proxy, the path a client's request
  # takes. Failures the proxy answers itself never reach service metrics.
  # Prometheus scrapes the prober, which performs the request named by the
  # `target` parameter; the probed URL becomes the instance label.
  - job_name: edge-probe
    metrics_path: /probe
    params:
      module: [http_2xx]
    scrape_timeout: 10s
    static_configs:
      - targets: ["http://frontend:8080/api/v1/items?limit=1"]
        labels:
          probe: items-api
      - targets: ["http://frontend:8080/api/v1/audit/items/000000000000000000000000/events?limit=1"]
        labels:
          probe: audit-api
      - targets: ["http://frontend:8080/"]
        labels:
          probe: web
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Self-monitoring so the monitoring plane's own health is observable.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
