# Dedicated namespace for the monitoring plane, isolated from the application
# namespace so its access can be governed independently.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  # Pod Security Admission enforces the restricted profile, as in the
  # application namespace.
  labels:
    app.kubernetes.io/name: monitoring
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
