# In-cluster Prometheus configuration.
#
# Targets are discovered dynamically from the Kubernetes API rather than
# statically listed, so any pod that opts in through the standard scrape
# annotations is collected without editing this file. The backend Deployment
# already carries those annotations.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: kubernetes
    stack: mongodb-microservice

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Annotation-driven pod discovery. Only pods with
  # `prometheus.io/scrape: "true"` are kept; the annotated path and port select
  # the metrics endpoint, and the `job` label is derived from the workload name
  # so dashboards and alerts can address it as `job="backend"`.
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels:
          - __address__
          - __meta_kubernetes_pod_annotation_prometheus_io_port
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        action: replace
        target_label: job
        regex: (.+)
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_container_name]
        target_label: container

  # Synthetic probes through the reverse proxy, the path a client's request
  # takes. While readiness withdraws every backend pod, the proxy answers
  # alone and the backend's metrics record nothing.
  # Prometheus scrapes the prober, which performs the request named by the
  # `target` parameter; the probed URL becomes the instance label.
  - job_name: edge-probe
    metrics_path: /probe
    params:
      module: [http_2xx]
    scrape_timeout: 10s
    static_configs:
      - targets: ["http://frontend.microservice.svc.cluster.local/api/v1/items?limit=1"]
        labels:
          probe: items-api
      - targets: ["http://frontend.microservice.svc.cluster.local/api/v1/audit/items/000000000000000000000000/events?limit=1"]
        labels:
          probe: audit-api
      - targets: ["http://frontend.microservice.svc.cluster.local/"]
        labels:
          probe: web
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Self-monitoring so the monitoring plane's own health is observable.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
