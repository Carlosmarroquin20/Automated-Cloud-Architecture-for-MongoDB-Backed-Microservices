apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The monitoring plane is deployed to its own namespace, isolating its access
# and lifecycle from the application.
namespace: monitoring

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: mongodb-microservice
      app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - prometheus/rbac.yaml
  - prometheus/deployment.yaml
  - prometheus/service.yaml
  - grafana/deployment.yaml
  - grafana/service.yaml

# Configuration and dashboards are generated from files so that a change to any
# of them rolls the owning Deployment automatically via the content hash. The
# Grafana datasource, provider, and dashboard mirror observability/ for the
# Compose stack; kustomize cannot reference files outside this root, so they are
# carried here as the cluster-native source.
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus/prometheus.yml
      - prometheus/alerts.yml
  - name: grafana-datasources
    files:
      - grafana/datasource.yaml
  - name: grafana-dashboard-provider
    files:
      - grafana/dashboard-provider.yaml
  - name: grafana-dashboards
    files:
      - grafana/dashboards/microservice-overview.json
