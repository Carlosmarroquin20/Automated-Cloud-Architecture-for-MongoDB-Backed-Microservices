# Non-sensitive backend configuration. Credential-bearing values are delivered
# separately through the mongodb-credentials Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    app.kubernetes.io/component: backend
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  APP_PORT: "8000"
  MONGODB_DB_NAME: "microservice"
  MONGODB_PING_ON_STARTUP: "true"
  MONGODB_SERVER_SELECTION_TIMEOUT_MS: "5000"
  MONGODB_CONNECT_TIMEOUT_MS: "10000"
  MONGODB_SOCKET_TIMEOUT_MS: "10000"
  MONGODB_MAX_POOL_SIZE: "50"
  MONGODB_MIN_POOL_SIZE: "0"
