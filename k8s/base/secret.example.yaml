# Template for the credential-bearing Secret. It is intentionally excluded from
# the kustomization so a placeholder is never applied. Provide the real value by
# either:
#   1) copying this file to secret.yaml (git-ignored), replacing the placeholder,
#      and applying it; or
#   2) creating it imperatively:
#      kubectl -n microservice create secret generic mongodb-credentials \
#        --from-literal=mongodb-uri='mongodb+srv://<user>:<password>@<cluster-host>/...'
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  labels:
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  mongodb-uri: "REPLACE_WITH_MONGODB_CONNECTION_STRING"
