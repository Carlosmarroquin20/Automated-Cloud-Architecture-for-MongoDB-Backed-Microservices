# Single-node NATS server with JetStream, the broker for domain events. Flags
# are passed explicitly instead of using the image's default configuration file,
# which also opens a cluster route port with a fixed credential; a single node
# needs only the client port, the monitoring endpoint, and JetStream storage.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: messaging
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/component: messaging
    spec:
      # The workload never calls the Kubernetes API, so the default service
      # account's token is not mounted.
      automountServiceAccountToken: false
      # The image defaults to root; the server needs no privilege, so it runs as
      # an unprivileged user and owns its storage through the fsGroup.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # JetStream flushes its file store on SIGTERM; the grace period bounds it.
      terminationGracePeriodSeconds: 30
      containers:
        - name: nats
          image: nats:2.15-alpine@sha256:823e7f1d6d8ffe3b30dbd73d4a06bbb939acf94929f7fdf224404da7a05bafb5
          command: ["nats-server"]
          args:
            - --jetstream
            - --store_dir=/data
            - --port=4222
            - --http_port=8222
            # A stable server name keeps JetStream metadata consistent across
            # restarts of the same pod.
            - --server_name=$(POD_NAME)
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Keeps the Go runtime's heap target inside the container limit, so
            # garbage collection intensifies before the kernel kills the process.
            - name: GOMEMLIMIT
              value: "200MiB"
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Ready only once JetStream is enabled, so the relay never declares
          # its stream against a server that cannot persist it.
          readinessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: monitor
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: messaging
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: client
      port: 4222
      targetPort: client
