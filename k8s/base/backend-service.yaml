# Named "backend" so in-cluster DNS matches the frontend nginx upstream
# (http://backend:8000), keeping the frontend image identical across Compose and
# Kubernetes.
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
