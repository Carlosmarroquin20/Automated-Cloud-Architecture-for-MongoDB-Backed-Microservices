# Outside the project's namespaces the policies do not apply, so cluster
# components the project does not own are never blocked by them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: out-of-scope
  namespace: kube-system
spec:
  selector:
    matchLabels: &labels
      app: out-of-scope
  template:
    metadata:
      labels: *labels
    spec:
      containers:
        - name: app
          image: registry.example/app:1.0
