# A mounted service account token is a credential for the Kubernetes API that
# any process in the pod can read. Workloads that call the API run under their
# own service account with scoped RBAC; every other workload runs under the
# default account and must not mount its token.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: restrict-service-account-token
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
  variables:
    - name: pod
      expression: "object.spec.template.spec"
    - name: defaultAccount
      expression: >-
        !has(variables.pod.serviceAccountName)
        || variables.pod.serviceAccountName == 'default'
  validations:
    - expression: >-
        !variables.defaultAccount
        || (has(variables.pod.automountServiceAccountToken)
          && !variables.pod.automountServiceAccountToken)
      message: >-
        pods under the default service account must set
        automountServiceAccountToken to false
      reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: restrict-service-account-token
spec:
  policyName: restrict-service-account-token
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: ["microservice", "monitoring"]
