# The base default-deny policy isolates the MongoDB pod, so this explicit rule is
# required to permit the backend to reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo
  labels:
    app.kubernetes.io/name: mongo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mongo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: outbox-relay
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: audit
      ports:
        - protocol: TCP
          port: 27017
