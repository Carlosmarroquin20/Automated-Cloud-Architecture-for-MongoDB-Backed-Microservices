# Single-node MongoDB for local iteration only. It carries no authentication
# because it is reachable exclusively from the backend within the cluster network
# policy; it is not a production database. It runs as a one-member replica set
# because the transactional outbox needs multi-document transactions, which a
# standalone server does not support.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/component: database
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongo
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      # The image's own unprivileged user (uid 999). fsGroup makes the data
      # volume writable for it where the storage driver supports ownership.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongo
          image: mongo:7@sha256:8bb4442761a63a8dda452744082cdac9644b429807eb977b42324a63cef59ca4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args: ["--replSet", "rs0", "--bind_ip_all"]
          # Initiates the replica set once mongod accepts connections. The hook
          # is idempotent, so restarts and rescheduling are safe; the container
          # is restarted if initiation never succeeds.
          lifecycle:
            postStart:
              exec:
                command:
                  - bash
                  - -c
                  - |
                    for _ in $(seq 1 60); do
                      mongosh --quiet --eval 'try { rs.status() } catch (e) { rs.initiate() }' && exit 0
                      sleep 2
                    done
                    exit 1
          ports:
            - name: mongo
              containerPort: 27017
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Ready only as the writable primary, so the headless Service never
          # routes the backend to a node that rejects writes. mongosh is a
          # Node.js process whose startup alone can exceed the default one-second
          # probe timeout under the CPU limit; the timeout is widened accordingly.
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "quit(db.hello().isWritablePrimary ? 0 : 1)"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
          # Liveness only asks whether mongod accepts connections: a member
          # that is not primary is alive, and restarting it would not help.
          livenessProbe:
            tcpSocket:
              port: mongo
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data/db
            # mongod's socket file and mongosh's scratch files.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
