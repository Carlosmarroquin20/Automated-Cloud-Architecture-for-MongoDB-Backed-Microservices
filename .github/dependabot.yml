# Automated dependency and toolchain updates.
#
# Every dependency surface is monitored so security patches are proposed
# continuously rather than discovered during an incident. Minor and patch bumps
# are grouped per ecosystem to keep review volume manageable while major bumps
# remain individual for deliberate evaluation. The commit-SHA pins used by the
# workflows and the digest pins on the base images are refreshed here.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # The CodeQL subactions (init, autobuild, analyze, upload-sarif) must run
      # at the same version; a partial bump fails analysis. They are updated
      # together across all update types and listed first so they are not
      # absorbed by the generic group.
      codeql:
        patterns:
          - "github/codeql-action*"
      actions:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /src/backend
    schedule:
      interval: weekly
    groups:
      backend-python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /src/frontend
    schedule:
      interval: weekly
    groups:
      # ESLint and its config package share a peer-dependency range, so a major
      # bump of one without the other cannot install. They are updated together
      # across all update types; this group is listed first because a dependency
      # joins the first group it matches.
      eslint:
        patterns:
          - "eslint"
          - "@eslint/js"
      frontend-npm:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only; newer compilers
      # break linting. Remove this entry once typescript-eslint widens its range.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]

  - package-ecosystem: docker
    directories:
      - /src/backend
      - /src/frontend
    schedule:
      interval: weekly
    groups:
      base-images:
        update-types: [minor, patch]
    ignore:
      # The builder tracks the Node.js 22 LTS line declared in the frontend
      # engines field. A move to the next LTS is a deliberate baseline change,
      # so newer majors (including non-LTS odd releases) are not proposed.
      - dependency-name: "node"
        versions: [">=23"]

  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly
    groups:
      terraform-providers:
        update-types: [minor, patch]
