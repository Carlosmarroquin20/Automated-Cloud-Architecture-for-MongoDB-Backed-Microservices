# Continuous Integration pipeline.
#
# The pipeline is expressed as a directed acyclic graph so independent quality
# gates run in parallel and the expensive stages (image build, simulated deploy)
# execute only after their prerequisites pass. Security findings are emitted as
# SARIF and surfaced in the repository Security tab rather than only in logs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege default. Jobs that publish results elevate their own scope.
permissions:
  contents: read

# In-flight runs for the same ref are superseded to conserve runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # Backend quality gate.
  # The interpreter matrix spans the local baseline (3.10) through the container
  # runtime target (3.12) to prove source compatibility across the supported
  # range rather than a single environment.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: src/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy --strict)
        run: mypy app tests

      - name: Test (pytest)
        run: pytest -q

  # ---------------------------------------------------------------------------
  # Frontend quality gate.
  # Dependencies are installed from the lockfile for a reproducible tree, and the
  # production bundle is built and retained as evidence of a shippable artifact.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Test (vitest)
        run: npm test

      - name: Build (vite)
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: src/frontend/dist
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Infrastructure-as-Code validation.
  # Initialization runs with the backend disabled so validation requires no cloud
  # credentials and provisions nothing.
  # ---------------------------------------------------------------------------
  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Initialize (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate -no-color

  # ---------------------------------------------------------------------------
  # Kubernetes manifest validation.
  # Rendered output is validated against upstream Kubernetes schemas so structural
  # regressions are caught without access to a live cluster.
  # ---------------------------------------------------------------------------
  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: "0.6.7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Install kubeconform
        run: |
          curl -sSfL \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz kubeconform
          sudo install kubeconform /usr/local/bin/

      - name: Validate base
        run: |
          kubectl kustomize k8s/base \
            | kubeconform -strict -summary -ignore-missing-schemas -verbose

      - name: Validate dev overlay
        run: |
          kubectl kustomize k8s/overlays/dev \
            | kubeconform -strict -summary -ignore-missing-schemas -verbose

      - name: Validate monitoring overlay
        run: |
          kubectl kustomize k8s/monitoring \
            | kubeconform -strict -summary -ignore-missing-schemas -verbose

  # ---------------------------------------------------------------------------
  # Dockerfile static analysis.
  # Findings are reported as SARIF; the build fails only on error-severity rules
  # so advisory hints do not block delivery while remaining visible in Security.
  # ---------------------------------------------------------------------------
  dockerfile-lint:
    name: Hadolint (${{ matrix.component }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: src/${{ matrix.component }}/Dockerfile
          format: sarif
          output-file: hadolint-${{ matrix.component }}.sarif
          failure-threshold: error

      - name: Upload results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        continue-on-error: true
        with:
          sarif_file: hadolint-${{ matrix.component }}.sarif
          category: hadolint-${{ matrix.component }}

  # ---------------------------------------------------------------------------
  # Infrastructure misconfiguration scan.
  # Trivy inspects Terraform, Kubernetes, Dockerfiles, and Compose for insecure
  # configuration. Reported for visibility; it does not gate delivery here.
  # ---------------------------------------------------------------------------
  iac-scan:
    name: IaC misconfiguration scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan configuration (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Upload results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  # ---------------------------------------------------------------------------
  # Secret scan.
  # The full history is scanned to enforce the zero-trust invariant that no
  # credential material has ever entered version control.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Dependency review.
  # Pull requests are blocked from introducing dependencies with known
  # vulnerabilities or non-permissive licenses before they reach the default
  # branch.
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # ---------------------------------------------------------------------------
  # Container image build and vulnerability scan.
  # Images are built once and loaded into the local daemon so the same artifact
  # that would ship is the artifact scanned. Layer caching is backed by the
  # Actions cache. Fixed CRITICAL/HIGH findings are reported as SARIF.
  # ---------------------------------------------------------------------------
  image-build-scan:
    name: Image build and scan (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src/${{ matrix.component }}
          file: src/${{ matrix.component }}/Dockerfile
          load: true
          push: false
          tags: mongodb-microservice-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: image
          image-ref: mongodb-microservice-${{ matrix.component }}:ci
          format: sarif
          output: trivy-image-${{ matrix.component }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-image-${{ matrix.component }}.sarif
          category: trivy-image-${{ matrix.component }}

  # ---------------------------------------------------------------------------
  # Ephemeral deployment and end-to-end smoke test.
  # The images built from this commit are loaded into a throwaway kind cluster
  # and the dev overlay is applied for real: rollouts must complete, probes must
  # pass under the zero-trust network policies, and a create/read/delete round
  # trip must succeed through the frontend reverse proxy. A server-side dry run
  # still runs first so admission errors surface before anything is scheduled.
  # The cluster lives only on the runner, so no cloud resource is created.
  # ---------------------------------------------------------------------------
  deploy-sim:
    name: Deploy and smoke test (kind)
    runs-on: ubuntu-latest
    needs: [manifests, image-build-scan]
    env:
      CLUSTER: deploy-sim
      NAMESPACE: microservice
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # The images are rebuilt from the layer cache populated by image-build-scan,
      # under the tags the manifests reference, which avoids moving tarballs
      # between jobs.
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src/backend
          file: src/backend/Dockerfile
          load: true
          push: false
          tags: mongodb-microservice-backend:latest
          cache-from: type=gha,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src/frontend
          file: src/frontend/Dockerfile
          load: true
          push: false
          tags: mongodb-microservice-frontend:latest
          cache-from: type=gha,scope=frontend

      - name: Create ephemeral cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: ${{ env.CLUSTER }}

      - name: Load images into the cluster
        run: |
          kind load docker-image mongodb-microservice-backend:latest --name "$CLUSTER"
          kind load docker-image mongodb-microservice-frontend:latest --name "$CLUSTER"

      - name: Validate with server-side dry run
        run: |
          # A server-side dry run does not persist the Namespace object, so it is
          # created first; the overlay is then checked by the API server's
          # admission chain before anything is scheduled.
          kubectl create namespace "$NAMESPACE"
          kubectl apply -k k8s/overlays/dev --dry-run=server

      - name: Apply the dev overlay
        run: kubectl apply -k k8s/overlays/dev

      - name: Wait for rollouts
        run: |
          kubectl -n "$NAMESPACE" rollout status statefulset/mongo --timeout=240s
          kubectl -n "$NAMESPACE" rollout status deployment/backend --timeout=240s
          kubectl -n "$NAMESPACE" rollout status deployment/frontend --timeout=240s

      - name: Smoke test through the frontend
        run: |
          kubectl -n "$NAMESPACE" port-forward svc/frontend 8080:80 > port-forward.log 2>&1 &
          sleep 3
          bash scripts/smoke-test.sh http://localhost:8080

      - name: Collect diagnostics
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get pods,svc,endpoints,networkpolicies -o wide || true
          kubectl -n "$NAMESPACE" describe pods || true
          for pod in $(kubectl -n "$NAMESPACE" get pods -o name); do
            echo "===== logs: $pod"
            kubectl -n "$NAMESPACE" logs "$pod" --all-containers --tail=80 || true
            kubectl -n "$NAMESPACE" logs "$pod" --all-containers --previous --tail=40 2>/dev/null || true
          done
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp || true
          cat port-forward.log 2>/dev/null || true
          # A condensed view is also emitted as annotations, which remain readable
          # on the run page and through the API without downloading the logs.
          kubectl -n "$NAMESPACE" get pods --no-headers 2>/dev/null | while read -r line; do
            echo "::warning title=pod::${line}"
          done
          for pod in $(kubectl -n "$NAMESPACE" get pods -o name 2>/dev/null); do
            states="$(kubectl -n "$NAMESPACE" get "$pod" -o jsonpath='{.status.containerStatuses[*].ready}')"
            case "$states" in
              *false*|"")
                logs="$(kubectl -n "$NAMESPACE" logs "$pod" --all-containers --previous --tail=6 2>/dev/null || kubectl -n "$NAMESPACE" logs "$pod" --all-containers --tail=6 2>/dev/null || true)"
                echo "::error title=${pod} not ready::$(printf '%s' "$logs" | paste -sd'|' - | cut -c1-900)"
                ;;
            esac
          done

      - name: Record deployment summary
        if: always()
        run: |
          {
            echo "### Ephemeral deployment"
            echo
            echo "Images from this commit deployed to a kind cluster with the \`k8s/overlays/dev\` overlay,"
            echo "followed by a readiness check and a create/read/delete round trip through the frontend."
            echo
            echo '```'
            kubectl -n "$NAMESPACE" get pods -o wide 2>/dev/null || echo "cluster unavailable"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
