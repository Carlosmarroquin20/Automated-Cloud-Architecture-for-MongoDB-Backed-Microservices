# Continuous Integration pipeline.
#
# The pipeline is expressed as a directed acyclic graph so independent quality
# gates run in parallel and the expensive stages (image build, simulated deploy)
# execute only after their prerequisites pass. Security findings are emitted as
# SARIF and surfaced in the repository Security tab rather than only in logs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege default. Jobs that publish results elevate their own scope.
permissions:
  contents: read

# In-flight runs for the same ref are superseded to conserve runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # Backend quality gate.
  # The interpreter matrix spans the local baseline (3.10) through the container
  # runtime target (3.12) to prove source compatibility across the supported
  # range rather than a single environment.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: src/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy --strict)
        run: mypy app tests

      - name: Test (pytest)
        run: pytest -q

  # ---------------------------------------------------------------------------
  # Frontend quality gate.
  # Dependencies are installed from the lockfile for a reproducible tree, and the
  # production bundle is built and retained as evidence of a shippable artifact.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Test (vitest)
        run: npm test

      - name: Build (vite)
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: src/frontend/dist
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Infrastructure-as-Code validation.
  # Initialization runs with the backend disabled so validation requires no cloud
  # credentials and provisions nothing.
  # ---------------------------------------------------------------------------
  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Initialize (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate -no-color

  # ---------------------------------------------------------------------------
  # Kubernetes manifest validation.
  # Rendered output is validated against upstream Kubernetes schemas so structural
  # regressions are caught without access to a live cluster.
  # ---------------------------------------------------------------------------
  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: "0.6.7"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Install kubeconform
        run: |
          curl -sSfL \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz kubeconform
          sudo install kubeconform /usr/local/bin/

      - name: Validate base
        run: |
          kubectl kustomize k8s/base \
            | kubeconform -strict -summary -ignore-missing-schemas -verbose

      - name: Validate dev overlay
        run: |
          kubectl kustomize k8s/overlays/dev \
            | kubeconform -strict -summary -ignore-missing-schemas -verbose

      - name: Validate monitoring overlay
        run: |
          kubectl kustomize k8s/monitoring \
            | kubeconform -strict -summary -ignore-missing-schemas -verbose

  # ---------------------------------------------------------------------------
  # Dockerfile static analysis.
  # Findings are reported as SARIF; the build fails only on error-severity rules
  # so advisory hints do not block delivery while remaining visible in Security.
  # ---------------------------------------------------------------------------
  dockerfile-lint:
    name: Hadolint (${{ matrix.component }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: src/${{ matrix.component }}/Dockerfile
          format: sarif
          output-file: hadolint-${{ matrix.component }}.sarif
          failure-threshold: error

      - name: Upload results
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: hadolint-${{ matrix.component }}.sarif
          category: hadolint-${{ matrix.component }}

  # ---------------------------------------------------------------------------
  # Infrastructure misconfiguration scan.
  # Trivy inspects Terraform, Kubernetes, Dockerfiles, and Compose for insecure
  # configuration. Reported for visibility; it does not gate delivery here.
  # ---------------------------------------------------------------------------
  iac-scan:
    name: IaC misconfiguration scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Scan configuration (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Upload results
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  # ---------------------------------------------------------------------------
  # Secret scan.
  # The full history is scanned to enforce the zero-trust invariant that no
  # credential material has ever entered version control.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Dependency review.
  # Pull requests are blocked from introducing dependencies with known
  # vulnerabilities or non-permissive licenses before they reach the default
  # branch.
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Review dependencies
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high

  # ---------------------------------------------------------------------------
  # Container image build and vulnerability scan.
  # Images are built once and loaded into the local daemon so the same artifact
  # that would ship is the artifact scanned. Layer caching is backed by the
  # Actions cache. Fixed CRITICAL/HIGH findings are reported as SARIF.
  # ---------------------------------------------------------------------------
  image-build-scan:
    name: Image build and scan (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: src/${{ matrix.component }}
          file: src/${{ matrix.component }}/Dockerfile
          load: true
          push: false
          tags: mongodb-microservice-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: image
          image-ref: mongodb-microservice-${{ matrix.component }}:ci
          format: sarif
          output: trivy-image-${{ matrix.component }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload results
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-image-${{ matrix.component }}.sarif
          category: trivy-image-${{ matrix.component }}

  # ---------------------------------------------------------------------------
  # Deploy simulation.
  # An ephemeral in-cluster Kubernetes (kind) validates the manifests against a
  # real API server via server-side dry run, exercising admission and schema
  # checks that offline rendering cannot. No workload is scheduled and no cloud
  # resource is created, so the simulation remains within free tiers.
  # ---------------------------------------------------------------------------
  deploy-sim:
    name: Deploy simulation (kind dry-run)
    runs-on: ubuntu-latest
    needs: [manifests, image-build-scan]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create ephemeral cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          cluster_name: deploy-sim

      - name: Simulate dev overlay apply
        run: |
          # A server-side dry run does not persist the Namespace object, so the
          # namespaced resources in the overlay would otherwise fail admission
          # against a namespace that does not yet exist. The namespace is created
          # for real first (an empty namespace in an ephemeral cluster schedules
          # no workload and creates no provider resource); the rest of the overlay
          # is then validated against it via server-side dry run.
          kubectl create namespace microservice
          kubectl apply -k k8s/overlays/dev --dry-run=server

      - name: Record simulation summary
        if: always()
        run: |
          {
            echo "### Deploy simulation"
            echo
            echo "Server-side dry run of \`k8s/overlays/dev\` against an ephemeral kind cluster."
            echo "No workload was scheduled and no cloud resource was created."
          } >> "$GITHUB_STEP_SUMMARY"
