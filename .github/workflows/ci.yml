# Continuous Integration pipeline.
#
# The pipeline is expressed as a directed acyclic graph so independent quality
# gates run in parallel and the expensive stages (image build, simulated deploy)
# execute only after their prerequisites pass. Security findings are emitted as
# SARIF and surfaced in the repository Security tab rather than only in logs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege default. Jobs that publish results elevate their own scope.
permissions:
  contents: read

# In-flight runs for the same ref are superseded to conserve runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # Backend quality gate.
  # The interpreter matrix spans the local baseline (3.10) through the container
  # runtime target (3.12) to prove source compatibility across the supported
  # range rather than a single environment.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: src/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy --strict)
        run: mypy app tests scripts

      - name: Test (pytest)
        run: pytest -q

      # The committed OpenAPI document is the published API contract. Changing
      # the API surface without regenerating it fails here. One matrix leg
      # suffices because the schema does not vary by interpreter version.
      - name: Check the OpenAPI contract
        if: matrix.python-version == '3.12'
        run: python scripts/export_openapi.py --check

  # ---------------------------------------------------------------------------
  # Audit service quality gate.
  # The audit service is an independently deployable codebase, so it carries
  # its own lint, type, and test gates over the same interpreter range.
  # ---------------------------------------------------------------------------
  audit:
    name: Audit service (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/audit
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: src/audit/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy --strict)
        run: mypy app tests

      - name: Test (pytest)
        run: pytest -q

  # ---------------------------------------------------------------------------
  # Frontend quality gate.
  # Dependencies are installed from the lockfile for a reproducible tree, and the
  # production bundle is built and retained as evidence of a shippable artifact.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Test (vitest)
        run: npm test

      - name: Build (vite)
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: src/frontend/dist
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Infrastructure-as-Code validation.
  # Initialization runs with the backend disabled so validation requires no cloud
  # credentials and provisions nothing.
  # ---------------------------------------------------------------------------
  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Initialize (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate -no-color

  # ---------------------------------------------------------------------------
  # Kubernetes manifest validation.
  # Rendered output is validated against upstream Kubernetes schemas so structural
  # regressions are caught without access to a live cluster.
  # ---------------------------------------------------------------------------
  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: "0.6.7"
      KYVERNO_CLI_IMAGE: ghcr.io/kyverno/kyverno-cli:v1.19.1@sha256:ced7b2be0b04250cabfe695f15307f69eb715fe23234816388af4f3812915b2a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0

      - name: Install kubeconform
        run: |
          curl -sSfL \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz kubeconform
          sudo install kubeconform /usr/local/bin/

      - name: Validate base
        run: |
          kubectl kustomize k8s/base \
            | kubeconform -strict -summary -ignore-missing-schemas -verbose

      - name: Validate dev overlay
        run: |
          kubectl kustomize k8s/overlays/dev \
            | kubeconform -strict -summary -ignore-missing-schemas -verbose

      - name: Validate monitoring overlay
        run: |
          kubectl kustomize k8s/monitoring \
            | kubeconform -strict -summary -ignore-missing-schemas -verbose

      - name: Validate admission policies
        run: |
          kubectl kustomize k8s/policies \
            | kubeconform -strict -summary -ignore-missing-schemas -verbose

      # The policies are evaluated offline with the Kyverno CLI, which runs
      # ValidatingAdmissionPolicy CEL the way the API server does. Their unit
      # tests assert each rule rejects its violation, admits compliant and
      # exempt workloads, and stays out of other namespaces.
      - name: Unit-test admission policies
        run: |
          docker run --rm -v "${PWD}/k8s/policies:/policies:ro" \
            "${KYVERNO_CLI_IMAGE}" test /policies/tests

      # Every workload the overlays deploy must pass the policies before it
      # reaches a cluster. Only workloads are evaluated: the policies match
      # nothing else, and cluster-scoped objects cannot satisfy a namespace
      # selector offline.
      - name: Evaluate overlays against admission policies
        run: |
          mkdir -p rendered
          for overlay in k8s/overlays/dev k8s/monitoring; do
            kubectl kustomize "${overlay}"
            echo "---"
          done | yq 'select(.kind == "Deployment" or .kind == "StatefulSet"
                     or .kind == "DaemonSet" or .kind == "Job")' > rendered/workloads.yaml
          docker run --rm -v "${PWD}/k8s/policies:/policies:ro" -v "${PWD}/rendered:/rendered:ro" \
            "${KYVERNO_CLI_IMAGE}" apply \
              /policies/require-read-only-root-filesystem.yaml \
              /policies/require-resources.yaml \
              /policies/require-image-digest.yaml \
              /policies/require-probes.yaml \
              /policies/restrict-service-account-token.yaml \
              --resource /rendered/workloads.yaml \
              --values-file /policies/tests/values.yaml

      # promtool ships in the Prometheus image that Compose runs, so rules and
      # configuration are checked by the version that evaluates them. Each
      # configuration is checked together with the rule file it references.
      - name: Validate and unit-test Prometheus configuration and rules
        env:
          PROMETHEUS_IMAGE: prom/prometheus:v2.53.1@sha256:f20d3127bf2876f4a1df76246fca576b41ddf1125ed1c546fbd8b16ea55117e6
        run: |
          for dir in observability/prometheus k8s/monitoring/prometheus; do
            echo "== ${dir}"
            docker run --rm --entrypoint promtool \
              -v "${PWD}/${dir}:/etc/prometheus:ro" \
              "${PROMETHEUS_IMAGE}" check config /etc/prometheus/prometheus.yml
          done
          # Rule unit tests feed synthetic series through the rules and assert
          # which alerts fire; the cluster rules are identical, as checked below.
          docker run --rm --entrypoint promtool \
            -v "${PWD}/observability/prometheus:/etc/prometheus:ro" \
            "${PROMETHEUS_IMAGE}" test rules /etc/prometheus/alerts.test.yml

      - name: Validate the synthetic prober configuration
        run: |
          docker run --rm -v "${PWD}/observability/blackbox:/etc/blackbox:ro" \
            prom/blackbox-exporter:v0.29.0@sha256:9613f2884689b6fad9f1939f6a3b0388c93a022cfaededb19545b329b5c83dea \
            --config.file=/etc/blackbox/blackbox.yml --config.check

      # Kustomize cannot read outside its root, so the cluster carries copies of
      # the Compose dashboards and rules. The copies must stay identical; rule
      # files are compared after parsing because their comments differ.
      - name: Verify monitoring copies match
        run: |
          diff -r observability/grafana/dashboards k8s/monitoring/grafana/dashboards
          diff observability/blackbox/blackbox.yml k8s/monitoring/blackbox/blackbox.yml
          diff <(yq -o=json '.' observability/prometheus/alerts.yml) \
            <(yq -o=json '.' k8s/monitoring/prometheus/alerts.yml)

  # ---------------------------------------------------------------------------
  # Dockerfile static analysis.
  # Findings are reported as SARIF; the build fails only on error-severity rules
  # so advisory hints do not block delivery while remaining visible in Security.
  # ---------------------------------------------------------------------------
  dockerfile-lint:
    name: Hadolint (${{ matrix.component }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, audit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: src/${{ matrix.component }}/Dockerfile
          format: sarif
          output-file: hadolint-${{ matrix.component }}.sarif
          failure-threshold: error

      - name: Upload results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        continue-on-error: true
        with:
          sarif_file: hadolint-${{ matrix.component }}.sarif
          category: hadolint-${{ matrix.component }}

  # ---------------------------------------------------------------------------
  # Infrastructure misconfiguration scan.
  # Trivy inspects Terraform, Kubernetes, Dockerfiles, and Compose for insecure
  # configuration. Reported for visibility; it does not gate delivery here.
  # ---------------------------------------------------------------------------
  iac-scan:
    name: IaC misconfiguration scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan configuration (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Upload results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  # ---------------------------------------------------------------------------
  # Secret scan.
  # The full history is scanned to enforce the zero-trust invariant that no
  # credential material has ever entered version control.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Dependency review.
  # Pull requests are blocked from introducing dependencies with known
  # vulnerabilities or non-permissive licenses before they reach the default
  # branch.
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # ---------------------------------------------------------------------------
  # Container image build and vulnerability scan.
  # Images are built once and loaded into the local daemon so the same artifact
  # that would ship is the artifact scanned. Layer caching is backed by the
  # Actions cache. Fixed CRITICAL/HIGH findings are reported as SARIF.
  # ---------------------------------------------------------------------------
  image-build-scan:
    name: Image build and scan (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, audit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src/${{ matrix.component }}
          file: src/${{ matrix.component }}/Dockerfile
          load: true
          push: false
          tags: mongodb-microservice-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: image
          image-ref: mongodb-microservice-${{ matrix.component }}:ci
          format: sarif
          output: trivy-image-${{ matrix.component }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-image-${{ matrix.component }}.sarif
          category: trivy-image-${{ matrix.component }}

  # ---------------------------------------------------------------------------
  # Ephemeral deployment and end-to-end smoke test.
  # The images built from this commit are loaded into a throwaway kind cluster
  # and the dev overlay is applied for real: rollouts must complete, probes must
  # pass under the zero-trust network policies, and a create/read/delete round
  # trip must succeed through the frontend reverse proxy. A server-side dry run
  # still runs first so admission errors surface before anything is scheduled.
  # The cluster lives only on the runner, so no cloud resource is created.
  # ---------------------------------------------------------------------------
  deploy-sim:
    name: Deploy and smoke test (kind)
    runs-on: ubuntu-latest
    needs: [manifests, image-build-scan]
    env:
      CLUSTER: deploy-sim
      NAMESPACE: microservice
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The images are rebuilt from the layer cache populated by image-build-scan,
      # under the tags the manifests reference, which avoids moving tarballs
      # between jobs.
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src/backend
          file: src/backend/Dockerfile
          load: true
          push: false
          tags: mongodb-microservice-backend:latest
          cache-from: type=gha,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src/frontend
          file: src/frontend/Dockerfile
          load: true
          push: false
          tags: mongodb-microservice-frontend:latest
          cache-from: type=gha,scope=frontend

      - name: Build audit image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src/audit
          file: src/audit/Dockerfile
          load: true
          push: false
          tags: mongodb-microservice-audit:latest
          cache-from: type=gha,scope=audit

      - name: Create ephemeral cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: ${{ env.CLUSTER }}

      - name: Load images into the cluster
        run: |
          kind load docker-image mongodb-microservice-backend:latest --name "$CLUSTER"
          kind load docker-image mongodb-microservice-frontend:latest --name "$CLUSTER"
          kind load docker-image mongodb-microservice-audit:latest --name "$CLUSTER"

      # The API server enforces the policies itself; it compiles a policy
      # asynchronously after it is created, so enforcement is awaited by
      # submitting a known violation until it is rejected.
      - name: Install admission policies
        run: |
          kubectl apply -k k8s/policies
          kubectl create namespace "$NAMESPACE"
          for _ in $(seq 1 30); do
            if ! kubectl -n "$NAMESPACE" create deployment policy-probe \
                --image=registry.example/app:1.0 --dry-run=server -o name >/dev/null 2>&1; then
              echo "admission policies are enforced"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the admission policies were not enforced within 60 seconds"
          exit 1

      - name: Validate with server-side dry run
        run: |
          # A server-side dry run does not persist the Namespace object, so it is
          # created in the previous step; the overlay is then checked by the API
          # server's admission chain, including the admission policies, before
          # anything is scheduled.
          kubectl apply -k k8s/overlays/dev --dry-run=server

      - name: Apply the dev overlay
        run: kubectl apply -k k8s/overlays/dev

      - name: Wait for rollouts
        run: |
          kubectl -n "$NAMESPACE" rollout status statefulset/mongo --timeout=240s
          kubectl -n "$NAMESPACE" rollout status statefulset/nats --timeout=240s
          kubectl -n "$NAMESPACE" rollout status deployment/backend --timeout=240s
          kubectl -n "$NAMESPACE" rollout status deployment/frontend --timeout=240s
          kubectl -n "$NAMESPACE" rollout status deployment/outbox-relay --timeout=240s
          kubectl -n "$NAMESPACE" rollout status deployment/audit --timeout=240s
          kubectl -n "$NAMESPACE" rollout status deployment/jaeger --timeout=240s

      # The deployed namespace now carries its Pod Security labels, so a pod
      # running as root must be refused by Pod Security Admission. The policy
      # fixtures the offline tests use are then submitted to the API server:
      # the compliant ones must be admitted and each violation refused by its
      # own policy, so the cluster and the offline evaluation agree.
      - name: Reject non-compliant workloads at admission
        run: |
          if out="$(kubectl -n "$NAMESPACE" run root-probe \
              --image=registry.example/app@sha256:1111111111111111111111111111111111111111111111111111111111111111 \
              --overrides='{"spec":{"securityContext":{"runAsUser":0}}}' --dry-run=server -o name 2>&1)"; then
            echo "::error::Pod Security Admission admitted a pod running as root"; exit 1
          fi
          echo "${out}" | grep -q 'violates PodSecurity "restricted' \
            || { echo "::error::unexpected refusal: ${out}"; exit 1; }
          echo "pod running as root: refused by Pod Security Admission"

          fixture() { yq "select(.metadata.name == \"$1\")" k8s/policies/tests/resources.yaml; }
          # out-of-scope sits in kube-system, where the policies do not apply.
          for name in compliant own-image out-of-scope; do
            out="$(fixture "${name}" | kubectl apply --dry-run=server -f - 2>&1)" \
              || { echo "::error::compliant fixture ${name} was refused: ${out}"; exit 1; }
            # Pod Security only warns on workloads and refuses their pods later,
            # so a warning on a compliant fixture is a failure here.
            if echo "${out}" | grep -q 'would violate PodSecurity'; then
              echo "::error::compliant fixture ${name} violates the restricted profile: ${out}"; exit 1
            fi
            echo "${name}: admitted"
          done
          while read -r name policy; do
            if out="$(fixture "${name}" | kubectl apply --dry-run=server -f - 2>&1)"; then
              echo "::error::${name} was admitted"; exit 1
            fi
            echo "${out}" | grep -q "${policy}" \
              || { echo "::error::${name} was refused for another reason: ${out}"; exit 1; }
            echo "${name}: refused by ${policy}"
          done <<'EOF'
          writable-init-container require-read-only-root-filesystem
          no-memory-limit require-resources
          tag-only-image require-image-digest
          no-readiness-probe require-probes
          default-token-mounted restrict-service-account-token
          EOF

      - name: Smoke test through the frontend
        run: |
          kubectl -n "$NAMESPACE" port-forward svc/frontend 8080:80 > port-forward.log 2>&1 &
          sleep 3
          bash scripts/smoke-test.sh http://localhost:8080

      # The smoke test creates and deletes exactly one item on a fresh database,
      # so the outbox must hold exactly one created and one deleted event for
      # that item, each committed atomically with its state change. The relay
      # publishes asynchronously, so publication is awaited with a deadline;
      # the stream must then hold exactly those two messages, which also proves
      # that no event was delivered twice.
      - name: Verify outbox events reach JetStream
        run: |
          outbox() {
            kubectl -n "$NAMESPACE" exec mongo-0 -- mongosh microservice --quiet --eval \
              'print(JSON.stringify(db.outbox.find({}, {type: 1, subject: 1, published_at: 1}).toArray()))'
          }
          for _ in $(seq 1 30); do
            events="$(outbox)"
            if echo "${events}" | jq -e 'length == 2 and all(.[]; .published_at != null)' >/dev/null; then
              break
            fi
            sleep 2
          done
          echo "${events}" | jq .
          echo "${events}" | jq -e '
            (map(.type) | sort) == ["item.created", "item.deleted"]
            and (map(.subject) | unique | length) == 1
            and all(.[]; .published_at != null)
          ' >/dev/null || { echo "::error::outbox events were not all published"; exit 1; }

          stream="$(kubectl -n "$NAMESPACE" exec nats-0 -- \
            wget -qO- 'http://127.0.0.1:8222/jsz?accounts=true&streams=true' \
            | jq '[.account_details[]?.stream_detail[]? | select(.name == "ITEMS")][0]')"
          echo "${stream}" | jq '{name, state: (.state | {messages, first_seq, last_seq})}'
          echo "${stream}" | jq -e '.state.messages == 2' >/dev/null \
            || { echo "::error::stream ITEMS does not hold exactly the two published events"; exit 1; }

          # The audit consumer must have acknowledged both messages: nothing
          # pending, nothing awaiting acknowledgement, and the acknowledgement
          # floor at the last stream sequence.
          consumer="$(kubectl -n "$NAMESPACE" exec nats-0 -- \
            wget -qO- 'http://127.0.0.1:8222/jsz?accounts=true&streams=true&consumers=true' \
            | jq '[.account_details[]?.stream_detail[]?.consumer_detail[]? | select(.name == "audit-service")][0]')"
          echo "${consumer}" | jq '{name, num_pending, num_ack_pending, num_redelivered, ack_floor}'
          echo "${consumer}" | jq -e '.num_pending == 0 and .num_ack_pending == 0 and .ack_floor.stream_seq == 2' >/dev/null \
            || { echo "::error::the audit consumer has not acknowledged both events"; exit 1; }

      # The dev overlay exports spans from all three services to Jaeger. Each of
      # the smoke test's two events must yield one trace in which the consumer
      # span is a child of the relay's publish span, and the publish span a
      # child of a span from the items API: the trace context survived the
      # outbox document, the broker headers, and both process boundaries.
      # Jaeger v2 serves searches through its v3 API, which returns OTLP JSON;
      # spans are first flattened to their trace, id, parent, name, and service.
      - name: Verify one trace spans the request, the publish, and the consumption
        run: |
          kubectl -n "$NAMESPACE" port-forward svc/jaeger 16686:16686 > jaeger-port-forward.log 2>&1 &
          sleep 3
          spans() {
            local since until
            since="$(date -u -d '-15 minutes' +%Y-%m-%dT%H:%M:%SZ)"
            until="$(date -u -d '+1 minute' +%Y-%m-%dT%H:%M:%SZ)"
            curl -fsS "http://localhost:16686/api/v3/traces?query.serviceName=$1&query.startTimeMin=${since}&query.startTimeMax=${until}&query.searchDepth=100" 2>/dev/null \
              | jq '[
                  .result.resourceSpans[]?
                  | ([.resource.attributes[]? | select(.key == "service.name") | .value.stringValue][0]) as $service
                  | .scopeSpans[]?.spans[]?
                  | {trace: .traceId, id: .spanId, parent: (.parentSpanId // ""), name, service: $service}
                ]' 2>/dev/null || echo '[]'
          }
          chains='[]'
          for _ in $(seq 1 30); do
            chains="$(spans audit-service | jq '
              (map({key: .id, value: .}) | from_entries) as $by
              | [ .[]
                  | select(.name | startswith("process "))
                  | . as $consume
                  | $by[$consume.parent] as $publish
                  | select($publish != null and ($publish.name | startswith("publish ")))
                  | $by[$publish.parent] as $origin
                  | select($origin != null)
                  | {
                      trace: $consume.trace,
                      origin: "\($origin.service): \($origin.name)",
                      publish: "\($publish.service): \($publish.name)",
                      consume: "\($consume.service): \($consume.name)"
                    }
                ]')"
            if echo "${chains}" | jq -e 'length >= 2' >/dev/null; then
              break
            fi
            sleep 2
          done
          echo "${chains}" | jq .
          # What the collector holds is printed so a failed assertion can be
          # diagnosed from the log alone: the services that reported spans, and
          # each service's recent spans with their trace and parent.
          echo "services: $(curl -sS 'http://localhost:16686/api/v3/services' || echo unavailable)"
          for service in mongodb-microservice outbox-relay audit-service; do
            echo "== ${service}"
            spans "${service}" | jq -r '.[:25][] | "  \(.trace[:8]) \(.service) \(.name) span=\(.id) parent=\(if .parent == "" then "-" else .parent end)"'
          done
          echo "${chains}" | jq -e '
            length == 2
            and all(.[];
              (.origin | startswith("mongodb-microservice: "))
              and (.publish | startswith("outbox-relay: publish items."))
              and (.consume | startswith("audit-service: process items.")))
            and ([.[].publish] | sort) == ["outbox-relay: publish items.created", "outbox-relay: publish items.deleted"]
          ' >/dev/null || { echo "::error::no complete request-to-consumption trace was recorded"; exit 1; }

      # Failure injection: the broker is removed while the API keeps taking
      # writes. Every write must still commit together with its event, the
      # events must wait in the outbox, and the audit consumer must report that
      # it is no longer bound to the stream. Once the broker returns, every
      # event must be published and recorded exactly once: outbox, stream, and
      # audit history end with the same count and nothing pending.
      - name: Survive a broker outage without losing events
        run: |
          kubectl -n "$NAMESPACE" port-forward svc/frontend 18080:80 > outage-port-forward.log 2>&1 &
          kubectl -n "$NAMESPACE" port-forward svc/audit 18000:8000 >> outage-port-forward.log 2>&1 &
          sleep 3
          mongo() { kubectl -n "$NAMESPACE" exec mongo-0 -- mongosh --quiet --eval "$1"; }
          pending() { mongo 'print(db.getSiblingDB("microservice").outbox.countDocuments({published_at: null}))'; }
          bound() { curl -fsS http://localhost:18000/metrics | awk '/^audit_consumer_connected /{print $2}'; }
          totals() {
            mongo 'print(JSON.stringify({
              outbox: db.getSiblingDB("microservice").outbox.countDocuments({}),
              audit: db.getSiblingDB("audit").events.countDocuments({})}))'
          }

          echo "before the outage: $(totals), consumer bound: $(bound)"
          kubectl -n "$NAMESPACE" scale statefulset/nats --replicas=0
          kubectl -n "$NAMESPACE" wait --for=delete pod/nats-0 --timeout=120s

          for i in 1 2 3 4 5; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://localhost:18080/api/v1/items \
              -H 'Content-Type: application/json' -d "{\"name\":\"outage-${i}\",\"quantity\":${i}}")"
            [ "${code}" = "201" ] || { echo "::error::write ${i} returned HTTP ${code} during the broker outage"; exit 1; }
          done
          sleep 10
          held="$(pending)"
          state="$(bound)"
          echo "during the outage: ${held} events held in the outbox, consumer bound: ${state}"
          [ "${held}" = "5" ] || { echo "::error::expected 5 events held in the outbox, found ${held}"; exit 1; }
          [ "${state}" = "0.0" ] || { echo "::error::the audit consumer still reports itself bound to the stream"; exit 1; }

          kubectl -n "$NAMESPACE" scale statefulset/nats --replicas=1
          kubectl -n "$NAMESPACE" rollout status statefulset/nats --timeout=180s

          # The relay drains the outbox and the consumer catches up; both are
          # asynchronous, so the final state is awaited with a deadline.
          final=""
          for _ in $(seq 1 45); do
            final="$(totals)"
            if [ "$(pending)" = "0" ] && echo "${final}" | jq -e '.outbox == .audit' >/dev/null; then
              break
            fi
            sleep 2
          done
          echo "after recovery: ${final}, consumer bound: $(bound)"
          [ "$(pending)" = "0" ] || { echo "::error::the outbox did not drain after the broker returned"; exit 1; }
          echo "${final}" | jq -e '.outbox == .audit' >/dev/null \
            || { echo "::error::the audit history does not hold every published event: ${final}"; exit 1; }
          [ "$(bound)" = "1.0" ] || { echo "::error::the audit consumer did not report itself bound again"; exit 1; }

          stream="$(kubectl -n "$NAMESPACE" exec nats-0 -- \
            wget -qO- 'http://127.0.0.1:8222/jsz?accounts=true&streams=true&consumers=true' \
            | jq '[.account_details[]?.stream_detail[]? | select(.name == "ITEMS")][0]
                  | {messages: .state.messages,
                     consumer: ([.consumer_detail[]? | select(.name == "audit-service")][0]
                               | {num_pending, num_ack_pending, ack_floor: .ack_floor.stream_seq})}')"
          echo "${stream}" | jq .
          echo "${stream}" | jq -e --argjson total "$(echo "${final}" | jq .outbox)" '
            .messages == $total
            and .consumer.num_pending == 0
            and .consumer.num_ack_pending == 0
            and .consumer.ack_floor == $total
          ' >/dev/null || { echo "::error::the stream and consumer do not account for every event exactly once"; exit 1; }

      # Failure injection: the audit database refuses one event's write until
      # its deliveries are exhausted. The event must become a dead letter rather
      # than vanish, the consumer must report it, and once the database accepts
      # writes again a replay must record it and leave no dead letter behind.
      - name: Dead-letter an event the audit database refuses, then replay it
        run: |
          kubectl -n "$NAMESPACE" port-forward svc/frontend 28080:80 > dead-letter-port-forward.log 2>&1 &
          kubectl -n "$NAMESPACE" port-forward svc/audit 28000:8000 >> dead-letter-port-forward.log 2>&1 &
          sleep 3
          mongo() { kubectl -n "$NAMESPACE" exec mongo-0 -- mongosh --quiet --eval "$1"; }
          dead_letters() { curl -fsS http://localhost:28000/metrics | awk '/^audit_dead_letters /{print $2}'; }
          history() { curl -fsS "http://localhost:28080/api/v1/audit/items/$1/events" | jq length; }

          # A validator no document satisfies makes every insert fail with a
          # write error, while the items database keeps accepting writes.
          mongo 'db.getSiblingDB("audit").runCommand({collMod: "events", validator: {_id: {$exists: false}}}).ok'
          id="$(curl -fsS -X POST http://localhost:28080/api/v1/items -H 'Content-Type: application/json' \
            -d '{"name":"dead-letter-probe","quantity":1}' | jq -r .id)"

          # Five deliveries spaced 1, 2, 4, 8, and 16 seconds apart, then the
          # broker's advisory, then the next refresh of the consumer's count.
          for _ in $(seq 1 40); do
            [ "$(dead_letters)" = "1.0" ] && break
            sleep 3
          done
          echo "while refused: dead letters $(dead_letters), history entries $(history "${id}")"
          [ "$(dead_letters)" = "1.0" ] || { echo "::error::the abandoned event did not become a dead letter"; exit 1; }
          [ "$(history "${id}")" = "0" ] || { echo "::error::the refused event reached the history"; exit 1; }

          mongo 'db.getSiblingDB("audit").runCommand({collMod: "events", validator: {}}).ok'
          kubectl -n "$NAMESPACE" exec deploy/audit -- python3 -m app.replay | tee replay.log
          tail -n 1 replay.log | jq -e '.outcomes == {"recorded": 1} and .remaining == 0' >/dev/null \
            || { echo "::error::the replay did not record the dead letter"; exit 1; }
          [ "$(history "${id}")" = "1" ] || { echo "::error::the replayed event is missing from the history"; exit 1; }

          for _ in $(seq 1 15); do
            [ "$(dead_letters)" = "0.0" ] && break
            sleep 2
          done
          [ "$(dead_letters)" = "0.0" ] || { echo "::error::the consumer still reports dead letters"; exit 1; }
          consumer="$(kubectl -n "$NAMESPACE" exec nats-0 -- \
            wget -qO- 'http://127.0.0.1:8222/jsz?accounts=true&streams=true&consumers=true' \
            | jq '{dead_letters: ([.account_details[]?.stream_detail[]? | select(.name == "AUDIT_DEAD_LETTERS")][0].state.messages),
                   consumer: ([.account_details[]?.stream_detail[]? | select(.name == "ITEMS")][0].consumer_detail[]?
                              | select(.name == "audit-service") | {num_pending, num_ack_pending})}')"
          echo "${consumer}" | jq .
          echo "${consumer}" | jq -e '
            .dead_letters == 0
            and .consumer.num_pending == 0
            and .consumer.num_ack_pending == 0
          ' >/dev/null || { echo "::error::dead letters or unacknowledged events remain"; exit 1; }

      # The monitoring plane runs for real, under the same Pod Security profile
      # and admission policies as the application. It is deployed after the
      # event pipeline checks so that its synthetic requests cannot affect them.
      - name: Deploy the monitoring plane
        run: |
          kubectl apply -k k8s/monitoring
          for workload in prometheus grafana blackbox-exporter; do
            kubectl -n monitoring rollout status "deployment/${workload}" --timeout=240s
          done

      # Discovery, RBAC, and the NetworkPolicies are only proven by scraping
      # through them, so every service and probe must report as healthy.
      - name: Verify the monitoring plane
        run: |
          kubectl -n monitoring port-forward svc/prometheus 39090:9090 > monitoring-port-forward.log 2>&1 &
          kubectl -n monitoring port-forward svc/grafana 33000:3000 >> monitoring-port-forward.log 2>&1 &
          sleep 3
          prom() {
            curl -fsS http://localhost:39090/api/v1/query --data-urlencode "query=$1" \
              | jq -r '.data.result[0].value[1] // "none"'
          }
          healthy=""
          for _ in $(seq 1 40); do
            if [ "$(prom 'min(up{job=~"backend|outbox-relay|audit"})')" = "1" ] \
              && [ "$(prom 'count(count by (job) (up{job=~"backend|outbox-relay|audit"}))')" = "3" ] \
              && [ "$(prom 'count(probe_success{job="edge-probe"})')" = "3" ] \
              && [ "$(prom 'min(probe_success{job="edge-probe"})')" = "1" ]; then
              healthy="yes"
              break
            fi
            sleep 5
          done
          curl -fsS http://localhost:39090/api/v1/query --data-urlencode 'query=up' \
            | jq -r '.data.result[] | "\(.metric.job) \(.metric.instance) up=\(.value[1])"' | sort
          curl -fsS http://localhost:39090/api/v1/query --data-urlencode 'query=probe_http_status_code' \
            | jq -r '.data.result[] | "\(.metric.probe) status=\(.value[1])"' | sort
          [ -n "${healthy}" ] || { echo "::error::the monitoring plane did not report every target as healthy"; exit 1; }

          curl -fsS http://localhost:39090/api/v1/rules \
            | jq -e '[.data.groups[].rules[].health] | all(. != "err")' >/dev/null \
            || { echo "::error::a Prometheus rule failed to evaluate"; exit 1; }
          dashboards="$(curl -fsS 'http://localhost:33000/api/search?type=dash-db' | jq -r '[.[].title] | sort | join(", ")')"
          echo "Grafana dashboards: ${dashboards}"
          [ "${dashboards}" = "Event Pipeline, Microservice Overview, Service Level Objectives" ] \
            || { echo "::error::Grafana did not provision the expected dashboards"; exit 1; }

      # Failure injection: the database is removed. A write must be refused
      # with 503 and Retry-After well inside the proxy's 60-second timeout,
      # rather than waiting out the driver's 120-second transaction retries
      # and committing after the client has given up. The request goes to a
      # backend pod directly: readiness withdraws the pods from the Service
      # while the database is down, so the proxy path would test the routing
      # instead of the service.
      - name: Refuse writes quickly while the database is down
        run: |
          kubectl -n "$NAMESPACE" scale statefulset/mongo --replicas=0
          kubectl -n "$NAMESPACE" wait --for=delete pod/mongo-0 --timeout=120s
          pod="$(kubectl -n "$NAMESPACE" get pods -l app.kubernetes.io/name=backend -o jsonpath='{.items[0].metadata.name}')"
          kubectl -n "$NAMESPACE" port-forward "pod/${pod}" 38000:8000 > database-outage-port-forward.log 2>&1 &
          sleep 3

          curl -sS -o response.json -D headers.txt -w '%{http_code} %{time_total}\n' --max-time 60 \
            -X POST http://localhost:38000/api/v1/items -H 'Content-Type: application/json' \
            -d '{"name":"during-outage","quantity":1}' | tee result.txt
          read -r code seconds < result.txt
          cat response.json; echo
          [ "${code}" = "503" ] || { echo "::error::a write during the outage returned HTTP ${code}"; exit 1; }
          awk -v s="${seconds}" 'BEGIN { exit !(s < 20) }' \
            || { echo "::error::the refusal took ${seconds}s"; exit 1; }
          grep -qi '^retry-after: 5' headers.txt || { echo "::error::Retry-After is missing"; exit 1; }
          jq -e '.error.code == "service_unavailable"' response.json >/dev/null \
            || { echo "::error::unexpected error envelope"; exit 1; }

          # Readiness now withdraws every backend pod, so the proxy answers alone.
          # The backend's own counters must stop moving while the probes keep
          # failing: the blind spot of a service-side indicator, seen from outside.
          # A client must still get a prompt answer it can act on, not a hang.
          kubectl -n monitoring port-forward svc/prometheus 39091:9090 >> database-outage-port-forward.log 2>&1 &
          kubectl -n "$NAMESPACE" port-forward svc/frontend 38080:80 >> database-outage-port-forward.log 2>&1 &
          sleep 3
          prom() {
            curl -fsS http://localhost:39091/api/v1/query --data-urlencode "query=$1" \
              | jq -r '.data.result[0].value[1] // "none"'
          }
          errors='sum(http_requests_total{job="backend",path=~"/api/.+",status=~"5.."}) or vector(0)'
          withdrawn=""
          for _ in $(seq 1 36); do
            ready="$(kubectl -n "$NAMESPACE" get deployment backend -o jsonpath='{.status.readyReplicas}')"
            status="$(prom 'probe_http_status_code{job="edge-probe",probe="items-api"}')"
            echo "ready backend pods: ${ready:-0}, items API probe status: ${status}"
            if [ -z "${ready}" ] && [ "${status}" = "502" ]; then
              withdrawn="yes"
              break
            fi
            sleep 5
          done
          [ -n "${withdrawn}" ] || { echo "::error::the probe never saw the proxy answering alone"; exit 1; }
          # Two scrape intervals let the last requests the backend answered settle.
          sleep 30
          before="$(prom "${errors}")"
          sleep 45
          after="$(prom "${errors}")"
          failed="$(prom 'max_over_time(probe_success{job="edge-probe",probe="items-api"}[45s])')"
          echo "backend 5xx counter: ${before} -> ${after}; best probe result in that time: ${failed}"
          [ "${before}" = "${after}" ] \
            || { echo "::error::the backend still counted errors while it was withdrawn"; exit 1; }
          [ "${failed}" = "0" ] \
            || { echo "::error::a probe succeeded while no backend pod was ready"; exit 1; }

          curl -sS -o response.json -D headers.txt -w '%{http_code} %{time_total}\n' --max-time 60 \
            -X POST http://localhost:38080/api/v1/items -H 'Content-Type: application/json' \
            -d '{"name":"no-backend-pod","quantity":1}' | tee result.txt
          read -r code seconds < result.txt
          cat response.json; echo
          [ "${code}" = "502" ] || { echo "::error::the proxy answered HTTP ${code} with no backend pod ready"; exit 1; }
          awk -v s="${seconds}" 'BEGIN { exit !(s < 5) }' \
            || { echo "::error::the proxy took ${seconds}s to answer"; exit 1; }
          grep -qi '^retry-after: 5' headers.txt || { echo "::error::Retry-After is missing from the proxy's answer"; exit 1; }
          jq -e '.error.code == "upstream_unavailable"' response.json >/dev/null \
            || { echo "::error::the proxy's answer lacks the error envelope"; exit 1; }

          kubectl -n "$NAMESPACE" scale statefulset/mongo --replicas=1
          kubectl -n "$NAMESPACE" rollout status statefulset/mongo --timeout=240s
          kubectl -n "$NAMESPACE" rollout status deployment/backend --timeout=240s
          kubectl -n "$NAMESPACE" wait --for=condition=Ready pod -l app.kubernetes.io/name=backend --timeout=180s
          # The refused write must not have committed behind the response.
          count="$(kubectl -n "$NAMESPACE" exec mongo-0 -- mongosh --quiet --eval \
            'print(db.getSiblingDB("microservice").items.countDocuments({name: "during-outage"}))')"
          [ "${count}" = "0" ] || { echo "::error::the refused write was committed (${count})"; exit 1; }
          recovered=""
          for _ in $(seq 1 24); do
            [ "$(prom 'min(probe_success{job="edge-probe"})')" = "1" ] && { recovered="yes"; break; }
            sleep 5
          done
          [ -n "${recovered}" ] || { echo "::error::the probes did not recover with the database"; exit 1; }

      - name: Collect diagnostics
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get pods,svc,endpoints,networkpolicies -o wide || true
          kubectl -n "$NAMESPACE" describe pods || true
          for pod in $(kubectl -n "$NAMESPACE" get pods -o name); do
            echo "===== logs: $pod"
            kubectl -n "$NAMESPACE" logs "$pod" --all-containers --tail=80 || true
            kubectl -n "$NAMESPACE" logs "$pod" --all-containers --previous --tail=40 2>/dev/null || true
          done
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp || true
          kubectl -n monitoring get pods,svc,endpoints -o wide || true
          kubectl -n monitoring get events --sort-by=.lastTimestamp || true
          for pod in $(kubectl -n monitoring get pods -o name 2>/dev/null); do
            echo "===== logs: $pod"
            kubectl -n monitoring logs "$pod" --all-containers --tail=60 || true
          done
          cat port-forward.log jaeger-port-forward.log outage-port-forward.log dead-letter-port-forward.log database-outage-port-forward.log monitoring-port-forward.log 2>/dev/null || true
          # A condensed view is also emitted as annotations, which remain readable
          # on the run page and through the API without downloading the logs.
          kubectl -n "$NAMESPACE" get pods --no-headers 2>/dev/null | while read -r line; do
            echo "::warning title=pod::${line}"
          done
          for pod in $(kubectl -n "$NAMESPACE" get pods -o name 2>/dev/null); do
            states="$(kubectl -n "$NAMESPACE" get "$pod" -o jsonpath='{.status.containerStatuses[*].ready}')"
            case "$states" in
              *false*|"")
                logs="$(kubectl -n "$NAMESPACE" logs "$pod" --all-containers --previous --tail=6 2>/dev/null || kubectl -n "$NAMESPACE" logs "$pod" --all-containers --tail=6 2>/dev/null || true)"
                echo "::error title=${pod} not ready::$(printf '%s' "$logs" | paste -sd'|' - | cut -c1-900)"
                ;;
            esac
          done

      - name: Record deployment summary
        if: always()
        run: |
          {
            echo "### Ephemeral deployment"
            echo
            echo "Images from this commit deployed to a kind cluster with the \`k8s/overlays/dev\` overlay,"
            echo "followed by a readiness check and a create/read/delete round trip through the frontend,"
            echo "event delivery to the audit service, a trace spanning all three services, a"
            echo "broker outage survived without losing or duplicating an event, and an event the"
            echo "audit database refused captured as a dead letter and replayed into the history,"
            echo "writes refused with 503 within seconds while the database was down, and"
            echo "non-compliant workloads refused by Pod Security Admission and admission policies."
            echo "The monitoring plane also ran: every target scraped, and the synthetic probes saw"
            echo "the proxy answering alone while the backend's own counters stood still."
            echo
            echo '```'
            kubectl -n "$NAMESPACE" get pods -o wide 2>/dev/null || echo "cluster unavailable"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
