# OpenSSF Scorecard supply-chain security analysis.
#
# Scorecard evaluates the repository against a catalogue of supply-chain security
# checks (branch protection, pinned dependencies, token permissions, dangerous
# workflow patterns, and more) and publishes the results as SARIF to code
# scanning. Publishing to the public Scorecard API also drives the score badge.
name: Scorecard

on:
  # Re-evaluate when branch protection changes, on a weekly cadence, and on push
  # to the default branch so the score tracks the current posture.
  branch_protection_rule:
  schedule:
    - cron: "20 7 * * 1"
  push:
    branches: [main]

# Read-only by default; the analysis job elevates only what publishing requires.
permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Required to upload SARIF results to code scanning.
      security-events: write
      # Required for the signed, verifiable publication to the Scorecard API.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the public Scorecard API so the results are verifiable and
          # the README badge can render the current score.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
