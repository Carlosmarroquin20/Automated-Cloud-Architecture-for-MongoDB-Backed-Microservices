# Static application security testing with CodeQL.
#
# CodeQL provides semantic code analysis for the two first-party languages in the
# repository. A weekly schedule re-scans the default branch against updated query
# packs so newly published vulnerability patterns are detected without a code
# change.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 06:00 UTC. Off-peak to avoid contending with change traffic.
    - cron: "0 6 * * 1"

# Least-privilege default; the analysis job elevates only to publish alerts.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Python covers the FastAPI backend; the JavaScript/TypeScript pack covers
        # the Vite client. Each language is analyzed in its own run.
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@6f5948dfacef28e207b48d0905cf90c03365536d # v3

      - name: Analyze
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          category: /language:${{ matrix.language }}
