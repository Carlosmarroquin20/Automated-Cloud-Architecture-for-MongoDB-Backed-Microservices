# Static asset delivery with a same-origin reverse proxy to the backend. The
# browser only ever contacts this origin, so no backend host is embedded in the
# shipped assets and cross-origin exposure is avoided.

# Per-client request rate limit for API traffic. Enforcing it in this proxy keeps
# the control independent of any ingress controller, so the same limit applies
# under Compose, on the VM host, and on Kubernetes. Clients are keyed by their
# connection address; behind another proxy that address is the proxy hop, so the
# limit then caps aggregate load per hop rather than per end user. Health probes
# are not limited, so throttling never affects readiness.
limit_req_zone $binary_remote_addr zone=api_per_client:10m rate=20r/s;

server {
    # A high port lets nginx run unprivileged; Services keep exposing port 80.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Conservative security headers for the served document. nginx drops every
    # inherited add_header in a location that declares its own, so locations
    # adding headers repeat this set.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Bounded upstream waits. With nginx's 60-second defaults, a client waited a
    # full minute whenever no backend pod was ready and the connection attempt
    # was dropped rather than refused. The read timeout stays above the backend's
    # own deadlines (ten seconds for a write), so the service reports its failures
    # itself and the proxy only speaks for an upstream that does not answer.
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed build assets are immutable and cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # API and health traffic is forwarded to the backend service by name.
    location /api/ {
        # A burst allowance absorbs normal page loads; requests beyond it are
        # rejected immediately rather than queued, so latency stays bounded.
        limit_req zone=api_per_client burst=40 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;
        error_page 429 = @rate_limited;
        error_page 502 504 = @upstream_unavailable;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Audit history is served by the audit service under the same origin. The
    # longer prefix takes precedence over /api/, and the same per-client limit
    # applies because both locations share one rate-limit zone.
    location /api/v1/audit/ {
        limit_req zone=api_per_client burst=40 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;
        error_page 429 = @rate_limited;
        error_page 502 504 = @upstream_unavailable;

        proxy_pass http://audit:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        error_page 502 504 = @upstream_unavailable;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Rejections use the backend's error envelope, so API clients handle them
    # through the same parsing path as any other error.
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        return 429 '{"error":{"code":"rate_limited","message":"Too many requests; retry shortly"}}';
    }

    # An upstream that cannot be reached or does not answer in time is reported
    # with the same envelope and retry guidance as the backend's own 503. The
    # status stays 502, so an operator can tell the proxy answered alone. Both
    # causes share it because nginx's return directive takes a fixed status.
    location @upstream_unavailable {
        default_type application/json;
        add_header Retry-After 5 always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        return 502 '{"error":{"code":"upstream_unavailable","message":"The service is temporarily unavailable"}}';
    }
}
